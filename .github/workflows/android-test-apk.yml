name: Android test APK

on:
  push:
    branches: [feat/weekly-pantry-favourites]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: bash gradlew --no-daemon :app:assembleDebug
      - name: Prepare installable test build
        run: |
          mkdir -p apk
          cp android/app/build/outputs/apk/debug/app-debug.apk apk/MealBridge-Test.apk
          sha256sum apk/MealBridge-Test.apk > apk/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MealBridge-Test-APK
          path: apk/
          retention-days: 14
          if-no-files-found: error
